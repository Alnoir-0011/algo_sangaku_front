name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Deploy対象のコミットSHA（main に含まれる40桁フルSHA）"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: write

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate sha format
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::sha must be a full 40-character lowercase commit SHA"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure sha is contained in main
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          git merge-base --is-ancestor "$INPUT_SHA" origin/main \
            || { echo "::error::$INPUT_SHA is not an ancestor of main"; exit 1; }
          git checkout --detach "$INPUT_SHA"

      # check-runs が 0 件（[skip ci] 等で CI 自体が実行されなかった場合）でも
      # 空配列は無条件で合格してしまうため、必須チェック名を明示的に列挙して検証する。
      # ci.yml のジョブ名（e2etest は matrix のため各ブラウザ名を含む）と対応させること。
      # 同名チェックが再実行されている場合、check-runs には新旧両方のconclusionが
      # 混在して返る。id（作成順）が最大＝最新の実行結果のみを判定対象にする。
      - name: Verify CI passed for sha
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          runs=$(gh api --paginate "repos/${{ github.repository }}/commits/$INPUT_SHA/check-runs" \
            --jq '.check_runs[] | {id, name, conclusion}')

          if [ -z "$runs" ]; then
            echo "::error::no check runs found for $INPUT_SHA"
            exit 1
          fi

          successful=$(jq -s -r 'group_by(.name) | map(max_by(.id)) | .[] | select(.conclusion == "success") | .name' <<< "$runs")

          missing=0
          while IFS= read -r required; do
            if ! grep -qxF "$required" <<< "$successful"; then
              echo "::error::required check '$required' is missing or not successful in its latest run"
              missing=1
            fi
          done <<REQUIRED
          build
          lint
          componentstest
          coverage
          e2etest (chromium)
          e2etest (firefox)
          e2etest (webkit)
          REQUIRED

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install pnpm
        run: npm install -g pnpm@10.0.0
      - name: Install Vercel CLI
        run: npm install -g vercel@58.0.0
      # VERCEL_TOKEN は npm install 等のインストールステップからは見えないよう、
      # Vercel CLI を実際に使うステップにのみ env でスコープする。
      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod | tail -n 1)
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::unexpected deploy url: $url"
            exit 1
          fi
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-connrefused "$URL" > /dev/null

      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            state="success"
            description="Deployed to production"
          else
            state="failure"
            description="Deployment failed"
          fi
          gh api "repos/${{ github.repository }}/statuses/$INPUT_SHA" \
            -f state="$state" -f context="deploy/vercel-production" -f description="$description"
