# 単一パッケージ構成だが明示する。旧バージョンのpnpm（9系で再現確認済み）は
# このフィールドが未指定/空だと "packages field missing or empty" で失敗する。
# package.json#packageManager を pnpm@11.25.0 に固定した後も、Vercelのビルド
# ログ上でこのフィールド欠如によるインストール失敗が実際に発生していたため、
# 明示することで解決した（Vercel側のpnpmバージョン解決の詳細な内部挙動までは
# 特定できていないが、このフィールド追加後は実ビルドで pnpm v11.25.0 が
# 使われ成功することを確認済み）
packages:
  - "."
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
overrides:
  '@types/google.maps': 3.66.0
# Next 16 では new Headers(await headers()) が空の Headers になり、next-auth の signIn / signOut / update が
# cookie を見失う（サインアウトしても session-token が消えない）。beta.32 が最新で上流に修正版が無いため patch で回避している。
# 修正版が出たら patch を外すこと
patchedDependencies:
  next-auth@5.0.0-beta.32: patches/next-auth@5.0.0-beta.32.patch
# @mui/material-nextjs 6 系は peer の next が 15 までで、MUI 7 へ上げないと Next 16 に対応しない。
# MUI 全体の 7 系移行は別作業とし、ここでは peer のみ許容している
peerDependencyRules:
  allowedVersions:
    "@mui/material-nextjs>next": "16"
